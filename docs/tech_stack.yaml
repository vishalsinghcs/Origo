project: Origo (Enterprise AI Security Gateway)
backend:
  language: Python
  framework: FastAPI
  inference: vLLM / llama.cpp
  training: Unsloth, TRL, HuggingFace
  models:
    layer1: Qwen2.5-3B-Instruct (Fine-tuned LoRA)
    layer2: Qwen3-8B (Fine-tuned LoRA)
frontend:
  language: TypeScript
  framework: React (Vite)
  styling: TailwindCSS
database:
  audit_logs: PostgreSQL
infrastructure:
  deployment: Docker, AWS (EC2 g6.2xlarge, S3, SageMaker)
  orchestration: Docker Compose
data_engineering:
  synthetic_generation: Groq (llama-3.3-70b-versatile, llama-3.1-8b-instant)
  quality_filters: N-Gram hashing
